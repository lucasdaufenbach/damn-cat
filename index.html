<!DOCTYPE html>
<html>
<head>
    <title>Gato Maldito</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #222;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            background: #87CEEB;
            display: block;
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none; /* evita scroll durante toques e permite capturar pointer events */
        }

    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <script src="personagem.js"></script>
    <script src="modal.js"></script>
    <script src="game.js"></script>
</body>
</html>
