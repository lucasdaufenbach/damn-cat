<!DOCTYPE html>
<html>
<head>
    <title>Damn Cat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #222;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            background: #87CEEB;
            display: block;
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none; /* evita scroll durante toques e permite capturar pointer events */
        }

        #restart-btn {
            position: fixed;
            top: calc(50% + 60px);
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 18px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            background: #ff5959;
            color: #fff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            cursor: pointer;
            display: none;
            z-index: 1;
        }

        #restart-btn:active {
            transform: translateX(-50%) translateY(1px);
        }

        #next-btn {
            position: fixed;
            top: calc(50% + 100px);
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 18px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            background: #4caf50;
            color: #fff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            cursor: pointer;
            display: none;
            z-index: 1;
        }

        #next-btn:active {
            transform: translateX(-50%) translateY(1px);
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <button id="restart-btn" aria-label="Reiniciar">Reiniciar</button>
    <button id="next-btn" aria-label="Próxima fase">Próxima fase</button>
    <script src="game.js"></script>
</body>
</html>
